[project]
name = "kuhira"
version = "0.1.0"
description = "Where should Rwanda's next small-scale irrigation hectares go?"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[dependency-groups]
analysis = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "pyreadstat>=1.2",
  "statsmodels>=0.14",
  "rasterio>=1.4",
  "rasterstats>=0.20",
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "jupyterlab>=4.2",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "jupytext>=1.16",
]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["analysis", "dev"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
